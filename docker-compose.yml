services:
  db:
    image: pgvector/pgvector:pg16
    container_name: shopagent-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: shopagent
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d shopagent"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    container_name: shopagent-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # 容器内用服务名连库，覆盖 .env 里的 localhost
      PG_DSN: postgresql://postgres:postgres@db:5432/shopagent
      SHOPAGENT_STORE: pg
      SHOPAGENT_MODE: hybrid_rerank
      # 精排候选数；改 .env 里的值后重启 api 即可，不用重建镜像
      SHOPAGENT_RERANK_CANDIDATES: "${SHOPAGENT_RERANK_CANDIDATES:-20}"
    ports:
      - "8000:8000"
    volumes:
      # products.jsonl 和 memory_index 不在镜像里（.gitignore），挂进来
      - ./data:/app/data
      # 模型缓存只下载一次；不挂的话每次重建容器都要重新下 1GB+
      - hf_cache:/root/.cache/huggingface
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  hf_cache:
